plugins {
    id 'com.android.application'
}

android {
    namespace 'com.abudana.tatweer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.abudana.tatweer'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    signingConfigs {
        release {
            // CI makes a key for each build and passes it in through the environment.
            def ks = System.getenv('TATWEER_KS')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('TATWEER_KS_PASS')
                keyAlias 'abudana'
                keyPassword System.getenv('TATWEER_KS_PASS')
                storeType 'pkcs12'
            }
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('TATWEER_KS') ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
